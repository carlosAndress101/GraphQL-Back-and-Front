name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      # Audit only the new API's production dependencies at high severity.
      # apps/web stays on the legacy stack until the phase 4 rewrite and its
      # known advisories must not block CI (see docs/dependencies.md).
      # GHSA-7mx3-vvmw-hjmv is a transitive advisory in @graphql-tools/utils
      # via graphql-yoga; ignored until the upstream fix lands.
      - name: Audit API production dependencies
        run: pnpm --filter @app/api audit --prod --audit-level high --ignore GHSA-7mx3-vvmw-hjmv

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (no push)
        run: docker build --file apps/api/Dockerfile --tag app-api:ci .
